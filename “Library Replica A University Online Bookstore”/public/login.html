<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login | LibraryReplica</title>
  <meta name="description" content="Log in to your LibraryReplica student account.">
  <link rel="icon" href="images/logo.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Playfair+Display:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/auth.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
  <div id="site-header"></div>
  <main id="main-content">
    <div class="auth-wrap">
      <aside class="auth-aside" aria-hidden="false">
        <h2>Welcome back to your academic library.</h2>
        <p>Pick up where you left off: your cart, wishlist and orders are waiting.</p>
        <ul>
          <li><i class="fa-solid fa-check" aria-hidden="true"></i>Books for 16 categories</li>
          <li><i class="fa-solid fa-check" aria-hidden="true"></i>Sample PDF previews</li>
          <li><i class="fa-solid fa-check" aria-hidden="true"></i>Simulated, safe checkout</li>
        </ul>
      </aside>
      <section class="auth-panel">
        <div class="card auth-card">
          <h1>Log in</h1>
          <p class="sub">Use your university email and password.</p>
          <div id="demo-hint" class="demo-hint hidden"></div>
          <div id="login-alert" class="form-alert" role="alert"></div>
          <form id="login-form" novalidate>
            <div class="form-group">
              <label for="email">Email</label>
              <input class="input" id="email" type="email" autocomplete="email" placeholder="you@university.edu" required>
              <div class="form-error" data-error-for="email" aria-live="polite"></div>
            </div>
            <div class="form-group">
              <label for="password">Password</label>
              <div class="pw-field">
                <input class="input" id="password" type="password" autocomplete="current-password" placeholder="Your password" required>
                <button class="pw-toggle" id="toggle-password" type="button" aria-label="Show password" aria-pressed="false"><i class="fa-regular fa-eye" aria-hidden="true"></i></button>
              </div>
              <div class="form-error" data-error-for="password" aria-live="polite"></div>
            </div>
            <div class="auth-links">
              <label class="checkbox-row"><input type="checkbox" id="remember"> Remember me</label>
              <button class="link-btn-inline" id="forgot-btn" type="button">Forgot password?</button>
            </div>
            <button class="btn btn-primary btn-block" id="login-submit" type="submit">Log in</button>
          </form>
          <p class="auth-foot">New to LibraryReplica? <a href="signup.html">Create an account</a></p>
        </div>
      </section>
    </div>
  </main>
  <div id="site-footer"></div>
  <div id="toast-container" class="toast-container"></div>
  <script type="module" src="js/pages/login.js"></script>
</body>
</html>
