<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Books | LibraryReplica</title>
  <meta name="description" content="Search and filter the LibraryReplica sample catalogue by department, price, rating and availability.">
  <link rel="icon" href="images/logo.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Playfair+Display:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/books.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
  <div id="site-header"></div>
  <main id="main-content">
    <div class="container">
      <nav aria-label="Breadcrumb"><ol class="breadcrumb" id="breadcrumb"><li><a href="index.html">Home</a></li><li aria-current="page">Books</li></ol></nav>
      <div class="page-head"><h1 id="page-title">All Books</h1><p class="text-muted" id="page-sub">Sample catalogue entries. Not real publications.</p></div>
      <div class="catalogue">
        <aside class="filters card" id="filters" aria-label="Filters">
          <h2>Filters <button class="btn btn-outline btn-sm" type="button" id="clear-filters">Clear Filters</button></h2>
          <div class="filter-group">
            <h3>Department</h3>
            <div class="form-group" style="margin-bottom:.5rem"><label class="sr-only" for="f-dept">Department</label><select class="input" id="f-dept"></select></div>
            <div class="form-group" style="margin-bottom:0"><label class="sr-only" for="f-spec">Specialization</label><select class="input" id="f-spec"></select></div>
          </div>
          <div class="filter-group">
            <h3>Price (₹)</h3>
            <div class="price-inputs">
              <label class="sr-only" for="f-min">Minimum price</label><input class="input" id="f-min" type="number" min="0" step="50" placeholder="Min">
              <span aria-hidden="true">–</span>
              <label class="sr-only" for="f-max">Maximum price</label><input class="input" id="f-max" type="number" min="0" step="50" placeholder="Max">
            </div>
          </div>
          <div class="filter-group"><h3>Author</h3><div class="filter-list" id="f-authors"></div></div>
          <div class="filter-group"><h3>Publisher</h3><div class="filter-list" id="f-pubs"></div></div>
          <div class="filter-group">
            <h3>Rating</h3>
            <div class="filter-list" role="radiogroup" aria-label="Minimum rating">
              <label class="checkbox-row"><input type="radio" name="rating" value="0" checked> Any rating</label>
              <label class="checkbox-row"><input type="radio" name="rating" value="4"> <span class="stars">★★★★☆</span> &amp; up</label>
              <label class="checkbox-row"><input type="radio" name="rating" value="3"> <span class="stars">★★★☆☆</span> &amp; up</label>
              <label class="checkbox-row"><input type="radio" name="rating" value="2"> <span class="stars">★★☆☆☆</span> &amp; up</label>
            </div>
          </div>
          <div class="filter-group">
            <h3>Availability</h3>
            <div class="filter-list" role="radiogroup" aria-label="Availability">
              <label class="checkbox-row"><input type="radio" name="avail" value="all" checked> All books</label>
              <label class="checkbox-row"><input type="radio" name="avail" value="in"> In stock only</label>
              <label class="checkbox-row"><input type="radio" name="avail" value="out"> Out of stock</label>
            </div>
          </div>
        </aside>
        <section aria-label="Results">
          <div class="toolbar">
            <div>
              <button class="btn btn-outline btn-sm filter-toggle" type="button" id="filter-toggle" aria-expanded="false" aria-controls="filters"><i class="fa-solid fa-sliders" aria-hidden="true"></i> Filters</button>
              <span class="result-count" id="result-count" aria-live="polite">Loading…</span>
            </div>
            <div class="toolbar-right">
              <label class="sr-only" for="books-q">Search within results</label>
              <input class="input" id="books-q" type="search" placeholder="Search title, author, subject, ISBN…" style="width:min(280px,100%)">
              <label class="sr-only" for="f-sort">Sort by</label>
              <select class="input" id="f-sort">
                <option value="relevance">Sort: Relevance</option>
                <option value="price-asc">Price: Low to High</option>
                <option value="price-desc">Price: High to Low</option>
                <option value="newest">Newest</option>
                <option value="rating">Highest Rated</option>
                <option value="popular">Most Popular</option>
              </select>
            </div>
          </div>
          <div id="books-grid" class="books-grid"></div>
          <div id="pagination" class="pagination" aria-label="Pagination"></div>
        </section>
      </div>
    </div>
  </main>
  <div id="site-footer"></div>
  <div id="toast-container" class="toast-container"></div>
  <script type="module" src="js/pages/books-page.js"></script>
</body>
</html>
